# ==============================================================================
# CONFIGURACIÓN NGINX REVERSE PROXY - ECODELIVERY PLATFORM & AIRFLOW
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. SERVIDOR 1: BACKEND FASTAPI (ecodelivery.geisler.coderhivex.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name ecodelivery.geisler.coderhivex.com 100.60.229.203 localhost;

    # Proxy hacia el backend FastAPI
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Validación de certificados SSL (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# ------------------------------------------------------------------------------
# 2. SERVIDOR 2: APACHE AIRFLOW UI (airflow.geisler.coderhivex.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name airflow.geisler.coderhivex.com;

    # Proxy hacia la interfaz web de Airflow 3.0 (airflow-api-server)
    location / {
        proxy_pass http://airflow-api-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Preservar cookies entre proxy y cliente
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;

        # Soporte para WebSockets y streaming de logs de Airflow
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts extendidos para operaciones largas en Airflow
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Validación de certificados SSL (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
