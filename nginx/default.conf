# ==============================================================================
# CONFIGURACIÓN NGINX REVERSE PROXY - ECODELIVERY PLATFORM
# ==============================================================================

# SERVIDOR PRINCIPAL: BACKEND FASTAPI (ecodelivery.geisler.coderhivex.com)
server {
    listen 80;
    server_name ecodelivery.geisler.coderhivex.com 100.60.229.203 localhost;

    # Proxy hacia el backend FastAPI
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Validación de certificados SSL (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
