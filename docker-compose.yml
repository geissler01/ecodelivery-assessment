x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  env_file:
    - .env
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/tasks:/opt/airflow/tasks
    - ./dwh:/opt/airflow/dwh
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - ecodelivery_net

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecodelivery_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecodelivery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecodelivery_user_01**}
      POSTGRES_DB: ${POSTGRES_DB:-ecodelivery_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dwh/sql/01_init_databases.sql:/docker-entrypoint-initdb.d/01_init_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecodelivery_user} -d ${POSTGRES_DB:-ecodelivery_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecodelivery_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecodelivery_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecodelivery_net

  nginx:
    image: nginx:alpine
    container_name: ecodelivery_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    depends_on:
      - backend
      - airflow-api-server
    networks:
      - ecodelivery_net

  airflow-scheduler:
    <<: *airflow-common
    container_name: ecodelivery_airflow_scheduler
    command: scheduler
    restart: always

  airflow-api-server:
    <<: *airflow-common
    container_name: ecodelivery_airflow_api_server
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-triggerer:
    <<: *airflow-common
    container_name: ecodelivery_airflow_triggerer
    command: triggerer
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    container_name: ecodelivery_airflow_dag_processor
    command: dag-processor
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: ecodelivery_airflow_init
    command: >
      bash -c "
      echo '=== Ejecutando migración de DB de Airflow 3.0 ===' &&
      airflow db migrate &&
      echo '=== Creando usuario administrador ===' &&
      airflow users create --username ${AIRFLOW_ADMIN_USERNAME:-admin} --firstname ${AIRFLOW_ADMIN_FIRSTNAME:-Admin} --lastname ${AIRFLOW_ADMIN_LASTNAME:-User} --role Admin --email ${AIRFLOW_ADMIN_EMAIL:-admin@ecodelivery.com} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} || true
      "
    restart: "no"

volumes:
  postgres_data:
    name: ecodelivery_postgres_data
  certbot_etc:
    name: ecodelivery_certbot_etc
  certbot_var:
    name: ecodelivery_certbot_var

networks:
  ecodelivery_net:
    name: ecodelivery_network
