x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment: &airflow-common-env
    # --------------------------------------------------------------------------
    # CONFIGURACIÓN OFICIAL AIRFLOW 3.0 (AIP-72 / TASK SDK)
    # --------------------------------------------------------------------------
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-ecodelivery_user}:${POSTGRES_PASSWORD:-ecodelivery_user_01**}@postgres:5432/${AIRFLOW_DB_NAME:-airflow_db}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    
    # Clave oficial de Airflow 3 para firma JWT de Execution API [api_auth]
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    
    # URL de la Execution API (apunta al servicio airflow-api-server)
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    
    # FAB Auth Manager para compatibilidad de interfaz
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # URL base del servidor — necesaria para que FAB construya redirects correctos detrás de nginx
    AIRFLOW__WEBSERVER__BASE_URL: ${AIRFLOW__WEBSERVER__BASE_URL:-http://airflow.geisler.coderhivex.com}
    PYTHONPATH: /opt/airflow
    
    # Refresco de DAGs en desarrollo
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: 5
    AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_REFRESH_INTERVAL: 5
    # Limitar workers del api-server (evitar OOM en VPS con RAM limitada)
    AIRFLOW__API_SERVER__WORKERS: ${AIRFLOW__API_SERVER__WORKERS:-1}

    # Conexiones para tareas ETL
    AIRFLOW_OLTP_URI: postgresql+psycopg2://${POSTGRES_USER:-ecodelivery_user}:${POSTGRES_PASSWORD:-ecodelivery_user_01**}@postgres:5432/${POSTGRES_DB:-ecodelivery_db}
    AIRFLOW_DWH_URI: postgresql+psycopg2://${POSTGRES_USER:-ecodelivery_user}:${POSTGRES_PASSWORD:-ecodelivery_user_01**}@postgres:5432/${DWH_DB_NAME:-ecodelivery_dwh}

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/tasks:/opt/airflow/tasks
    - ./dwh:/opt/airflow/dwh
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - ecodelivery_net

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecodelivery_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecodelivery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecodelivery_user_01**}
      POSTGRES_DB: ${POSTGRES_DB:-ecodelivery_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dwh/sql/01_init_databases.sql:/docker-entrypoint-initdb.d/01_init_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecodelivery_user} -d ${POSTGRES_DB:-ecodelivery_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - ecodelivery_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecodelivery_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecodelivery_net

  nginx:
    image: nginx:alpine
    container_name: ecodelivery_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    depends_on:
      - backend
      - airflow-api-server
    networks:
      - ecodelivery_net

  airflow-scheduler:
    <<: *airflow-common
    container_name: ecodelivery_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-api-server:
    <<: *airflow-common
    container_name: ecodelivery_airflow_api_server
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    container_name: ecodelivery_airflow_dag_processor
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: ecodelivery_airflow_init
    user: "0:0"
    command: bash /init_airflow.sh
    restart: "no"

volumes:
  postgres_data:
    name: ecodelivery_postgres_data
  certbot_etc:
    name: ecodelivery_certbot_etc
  certbot_var:
    name: ecodelivery_certbot_var

networks:
  ecodelivery_net:
    name: ecodelivery_network
