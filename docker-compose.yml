services:
  postgres:
    image: postgres:16-alpine
    container_name: ecodelivery_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dwh/sql/01_init_databases.sql:/docker-entrypoint-initdb.d/01_init_databases.sql:ro
      - ./dwh/sql/02_bronze_tables.sql:/docker-entrypoint-initdb.d/02_bronze_tables.sql:ro
      - ./dwh/sql/03_silver_tables.sql:/docker-entrypoint-initdb.d/03_silver_tables.sql:ro
      - ./dwh/sql/04_gold_star_schema.sql:/docker-entrypoint-initdb.d/04_gold_star_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - ecodelivery_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecodelivery_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecodelivery_net

  nginx:
    image: nginx:alpine
    container_name: ecodelivery_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    depends_on:
      - backend
    networks:
      - ecodelivery_net

volumes:
  postgres_data:
    name: ecodelivery_postgres_data
  certbot_etc:
    name: ecodelivery_certbot_etc
  certbot_var:
    name: ecodelivery_certbot_var

networks:
  ecodelivery_net:
    name: ecodelivery_network
