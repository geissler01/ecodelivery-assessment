x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment: &airflow-common-env
    # --------------------------------------------------------------------------
    # CONFIGURACIÓN OFICIAL AIRFLOW 3.0 (AIP-72 / TASK SDK)
    # --------------------------------------------------------------------------
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-ecodelivery_user}:${POSTGRES_PASSWORD:-ecodelivery_user_01**}@postgres:5432/${AIRFLOW_DB_NAME:-airflow_db}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-ny1LqUawxCCMONsG-jG5n1JbfgK83Q3rG8N59XYzOvg=}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-3f55ead9c0ca9fc167dca22ec35c7393a4eb74666673863df1c2691bac6e33e8}
    
    # Clave oficial de Airflow 3 para firma JWT de Execution API [api_auth]
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-9cf786ebdbf503bf523c25be9a166dca35d7b0c7f5b9c39d434c38abf8e3de4d}
    
    # URL de la Execution API (apunta al servicio airflow-api-server)
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    
    # FAB Auth Manager para compatibilidad de interfaz
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    PYTHONPATH: /opt/airflow
    
    # Refresco de DAGs en desarrollo
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 5
    AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_REFRESH_INTERVAL: 5

    # Conexiones para tareas ETL hacia el DWH local
    AIRFLOW_OLTP_URI: postgresql+psycopg2://${POSTGRES_USER:-ecodelivery_user}:${POSTGRES_PASSWORD:-ecodelivery_user_01**}@postgres:5432/${POSTGRES_DB:-ecodelivery_db}
    AIRFLOW_DWH_URI: postgresql+psycopg2://${POSTGRES_USER:-ecodelivery_user}:${POSTGRES_PASSWORD:-ecodelivery_user_01**}@postgres:5432/${DWH_DB_NAME:-ecodelivery_dwh}

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/tasks:/opt/airflow/tasks
    - ./dwh:/opt/airflow/dwh
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - ecodelivery_local_net

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecodelivery_postgres_local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecodelivery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecodelivery_user_01**}
      POSTGRES_DB: ${POSTGRES_DB:-ecodelivery_db}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
      - ./dwh/sql/01_init_databases.sql:/docker-entrypoint-initdb.d/01_init_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecodelivery_user} -d ${POSTGRES_DB:-ecodelivery_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - ecodelivery_local_net

  airflow-scheduler:
    <<: *airflow-common
    container_name: ecodelivery_airflow_scheduler_local
    command: scheduler
    restart: always

  airflow-api-server:
    <<: *airflow-common
    container_name: ecodelivery_airflow_api_server_local
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-triggerer:
    <<: *airflow-common
    container_name: ecodelivery_airflow_triggerer_local
    command: triggerer
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    container_name: ecodelivery_airflow_dag_processor_local
    command: dag-processor
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: ecodelivery_airflow_init_local
    command: >
      bash -c "
      echo '=== Ejecutando migración de DB de Airflow 3.0 ===' &&
      airflow db migrate &&
      echo '=== Creando usuario administrador ===' &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@ecodelivery.com --password ${AIRFLOW_ADMIN_PASSWORD:-admin} || true
      "
    restart: "no"

volumes:
  postgres_local_data:
    name: ecodelivery_postgres_local_data

networks:
  ecodelivery_local_net:
    name: ecodelivery_local_network
